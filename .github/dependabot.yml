# Dependabot configuration tuned for the v4 staging-branch release flow.
#
# All Dependabot PRs target `next` so they pool with every other contributor
# change and batch into the next release. dependabot-auto-merge.yml auto-merges
# patch/minor bumps into `next` after CI passes. Security updates are detected
# by hotfix-redirector.yml (GHSA references in the PR body) and auto-promoted
# from `next` → `hotfixes` so they ship via the hotfix lane instead of waiting
# for the next-batch release.

version: 2
updates:
    - package-ecosystem: "github-actions"
      directory: "/"
      target-branch: "next"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 5
      commit-message:
          prefix: "deps"
      groups:
          security:
              applies-to: security-updates
              patterns: ["*"]
          patch:
              applies-to: version-updates
              update-types: ["patch"]
          minor:
              applies-to: version-updates
              update-types: ["minor"]

    - package-ecosystem: "npm"
      directory: "/"
      target-branch: "next"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 5
      commit-message:
          prefix: "deps"
      groups:
          # vitest and @vitest/coverage-v8 (and other @vitest/* packages) peer
          # each other exactly, so bumping one without the other breaks
          # `npm ci` with an ERESOLVE. Bump the whole family together in one
          # PR. Must come before security/patch/minor below — Dependabot
          # assigns each update to the FIRST matching group.
          vitest:
              patterns:
                  - "vitest"
                  - "@vitest/*"
          # @eslint/js peers eslint with a major-locked range ("^10.0.0"), so a
          # future eslint major bump without @eslint/js moving too would hit
          # the same npm ci ERESOLVE class as the vitest/coverage-v8 split.
          # @cldmv/eslint-plugin-jsonv doesn't peer eslint directly but is
          # bundled here to keep the lint-config family moving together.
          eslint:
              patterns:
                  - "eslint"
                  - "@eslint/*"
                  - "@cldmv/eslint-plugin-*"
          # @cldmv/prettier-plugin-jsonv peers prettier with a major-locked
          # range ("^3.0.0") — same reasoning as the eslint group above.
          prettier:
              patterns:
                  - "prettier"
                  - "@cldmv/prettier-plugin-*"
          security:
              applies-to: security-updates
              patterns: ["*"]
          patch:
              applies-to: version-updates
              update-types: ["patch"]
          minor:
              applies-to: version-updates
              update-types: ["minor"]
