# Path-based PR auto-labeler. Uses CLDMV's org-default labeler.default.yml;
# override per-repo by adding .github/labeler.yml (same shape).
name: 🏷️ PR Labeler

# SECURITY NOTE: pull_request_target runs in the BASE repo's context with WRITE
# permissions. SAFE — no checkout of PR head, no PR-supplied code execution,
# REST-API-only (read file list, post labels).
on:
    pull_request_target:
        types: [opened, synchronize, reopened, ready_for_review]

permissions:
    contents: read
    pull-requests: write

jobs:
    label:
        uses: CLDMV/.github/.github/workflows/reusable-pr-labeler.yml@v4
        secrets:
            BOT_APP_CLIENT_ID: ${{ secrets.CLDMV_BOT_APP_CLIENT_ID }}
            BOT_APP_PRIVATE_KEY: ${{ secrets.CLDMV_BOT_APP_PRIVATE_KEY }}
